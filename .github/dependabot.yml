version: 2
# Monthly and grouped on purpose: ungrouped weekly updates across this fleet
# would be dozens of PRs a week. One PR per group per month is something a
# person can actually read.
#
# No github-actions entry: this repo has no .github/workflows, so the entry
# would match nothing. Add one alongside the first workflow.
updates:
  # ⚠️ Without this entry Dependabot never looks at package-lock.json at all,
  # and security advisories accumulate forever with nothing opening a PR.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # ⚠️ Security updates are NOT grouped by default, so three advisories in
      # one lockfile get three PRs that all edit it. Merging any one
      # invalidates the other two, `@dependabot recreate` rebuilds them, and
      # the next merge breaks them again -- a loop this fleet actually hit on
      # Lobster, findmy-cli and openclaw-parcel. This group ends it.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      production:
        dependency-type: production
      # typescript moves ahead of everything built on its API, so a TS major
      # bundled into the dev group takes the healthy updates down with it.
      # On its own it fails alone and visibly instead.
      typescript:
        patterns:
          - "typescript"
      types:
        patterns:
          - "@types/*"
      development:
        dependency-type: development
        exclude-patterns:
          - "typescript"
          - "@types/*"
    commit-message:
      prefix: deps
    ignore:
      # @types/node is capped at ^22 on purpose, so decline the majors.
      #
      # This plugin is isDesktopOnly: true, so it runs in Obsidian's Electron
      # renderer -- never in bare Node. The Node that Electron bundles is what
      # the code actually gets: roughly 20 at manifest.json's minAppVersion
      # (1.7.0) through 24 on current desktop (1.13.7 -> Electron 43.3.0 ->
      # Node 24.18.1). There is no Obsidian anywhere that ships Node 26.
      #
      # tsconfig.json sets "types": ["node"] and src/services/claude-cli.ts
      # genuinely needs it (require, child_process, process, Buffer), so unlike
      # the sibling obsidian-share plugin this cannot simply be dropped --
      # removing it produces 10 x TS2591. Capping is the remaining option:
      # typing above the bundled Node lets tsc bless APIs the renderer lacks.
      #
      # Raise the cap when minAppVersion moves, not when @types/node ships.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
