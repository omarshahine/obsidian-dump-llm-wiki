name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # One in-flight run per ref. github.ref is refs/pull/N/merge for PRs and
  # refs/heads/main for pushes, so PR and main runs never share a group.
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs only. Pushes to main run to completion so the
  # green/red record for every commit on main survives a rapid follow-up push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# These jobs only read the repository; nothing publishes or writes.
permissions:
  contents: read

jobs:
  build:
    # manifest.json sets isDesktopOnly: true, so this plugin only ever runs inside
    # Obsidian desktop's Electron: Node 24.18.1 on Obsidian 1.13.7 (Electron 43.3.0),
    # down to Node 20 at the declared minAppVersion 1.7.0 (Electron 30). Pinned to
    # 24, the version current users actually run. The shipped bundle is es2022 and
    # the build is esbuild-only, so this Node version governs the build toolchain;
    # it is not a compatibility matrix over the 20-24 range.
    name: "npm run ${{ matrix.check }} (node 24)"
    strategy:
      fail-fast: false
      matrix:
        # esbuild strips types without reading them, so `build` proves the
        # bundle links and nothing about the types. `typecheck` is the entry
        # that actually reads them; both run because either can fail alone.
        check: [build, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      # package-lock.json is committed, so npm ci applies and a stale lockfile
      # fails the build rather than being silently repaired.
      - run: npm ci
      - run: npm run ${{ matrix.check }}
